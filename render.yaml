services:
  - type: web
    name: papertoday
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --worker-class gthread --threads 4 --timeout 120 --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AI_API_URL
        value: https://llmapi.paratera.com/v1/chat/completions
      - key: AI_MODEL
        value: Qwen3.8-Max
      - key: AI_ENRICH_MODEL
        value: Kimi-K3
      - key: AI_API_KEY
        sync: false
      # Paratera 自定义 TLS 链在部分环境会触发 SSL EOF；设为 0 关闭校验。
      - key: AI_SSL_VERIFY
        value: "0"
      # 接口不支持 response_format 时改为 0。
      - key: AI_JSON_MODE
        value: "1"
